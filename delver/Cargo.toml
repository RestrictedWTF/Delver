[workspace]
members = [
	"delver-core",
	"corpus",
	"delver-analysis",
	"delver-disasm",
	"delver-format",
	"delver-protocol",
	"delver-rpc",
	"provider-file",
	"server-analysis",
	"delverctl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Delver Contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
schemars = "0.8"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
object = "0.36"
memmap2 = "0.9"
thiserror = "2"
anyhow = "1.0"
clap = { version = "4.3.0", features = ["derive"] }
windows-sys = { version = "0.61", features = [] }
delver-core = { path = "delver-core" }
delver-corpus = { path = "corpus" }
delver-analysis = { path = "delver-analysis" }
delver-disasm = { path = "delver-disasm" }
delver-format = { path = "delver-format" }
delver-protocol = { path = "delver-protocol" }
delver-rpc = { path = "delver-rpc" }
