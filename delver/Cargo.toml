[workspace]
members = [
	"delver-core",
	"corpus",
	"delver-analysis",
	"delver-disasm",
	"delver-format",
	"delver-protocol",
	"delver-rpc",
	"delver-mcp",
	"agent-bridge-relay",
	"provider-file",
	"server-analysis",
	"delverctl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Delver Contributors"]
license = "MIT"

# Analysis decodes millions of instructions per image. At `opt-level = 0` an
# unoptimized `iced-x86` turns opening a large target into a minutes-long wait,
# and the IDE runs whatever plain `cargo build` produced — so an unusable debug
# build is an unusable IDE.
#
# Dependencies are optimized even in dev builds: nobody steps through the
# decoder, and they are compiled once and then cached.
[profile.dev.package."*"]
opt-level = 3

# The descent loop itself is hot enough to matter. `opt-level = 1` keeps debug
# info and fast rebuilds while removing the worst of the unoptimized overhead.
[profile.dev]
opt-level = 1

[workspace.dependencies]
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
schemars = "0.8"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
object = "0.36"
memmap2 = "0.9"
thiserror = "2"
anyhow = "1.0"
clap = { version = "4.3.0", features = ["derive"] }
windows-sys = { version = "0.61", features = [] }
libc = "0.2"
sha2 = "0.10"
delver-core = { path = "delver-core" }
delver-corpus = { path = "corpus" }
delver-analysis = { path = "delver-analysis" }
delver-disasm = { path = "delver-disasm" }
delver-format = { path = "delver-format" }
delver-protocol = { path = "delver-protocol" }
delver-rpc = { path = "delver-rpc" }
