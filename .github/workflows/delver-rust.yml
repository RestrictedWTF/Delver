name: Delver Rust

# Gates the `delver/` Rust workspace: the providers, the analysis server, the
# protocol crate, and the golden corpus. Nothing covered this before — the only
# Rust job in this repo builds VS Code's own `cli/`, a different workspace — so
# a formatting or test regression in ~23k lines reached `main` unremarked, and
# one did.
#
# The corpus check is the load-bearing step. It recomputes facts for every
# synthetic sample and diffs them against committed snapshots, so a change that
# quietly alters what Delver believes about a binary fails here rather than
# being noticed months later against a real one.

on:
  push:
    branches: [main]
    paths:
      - 'delver/**'
      - '.github/workflows/delver-rust.yml'
  pull_request:
    paths:
      - 'delver/**'
      - '.github/workflows/delver-rust.yml'
  workflow_dispatch:

jobs:
  delver-rust:
    name: Delver Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delver
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          set -e
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Versions
        run: |
          set -e
          rustc --version
          cargo --version

      # Formatting first: it is the cheapest failure and the least interesting
      # to debug from a test log.
      - name: Formatting
        run: cargo fmt --all -- --check

      # Clippy before the tests: it covers every target including examples, so
      # it catches a lint in code the test run never builds, and it fails in
      # seconds rather than after a full test cycle. `-D warnings` is the point
      # — a warning nobody has to fix is one everybody learns to scroll past.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Runs last because a snapshot mismatch is the failure most worth reading
      # in isolation: it means recomputed facts moved, and the diff is the
      # message.
      - name: Golden corpus
        run: cargo run -p delver-corpus -- check
